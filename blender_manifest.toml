schema_version = "1.0.0"

id = "quickcollision"
version = "0.1.0"
name = "Quick Collision"
tagline = "Create fitted colliders for game-engine export"
maintainer = "Trey"
type = "add-on"
tags = ["3D View"]
website = "https://github.com/modsoft/blender-quickcollision"

blender_version_min = "4.2.0"

copyright = [
  "2026 Trey",
  "2004 Open Dynamics Framework Group (StanHull)",
]

# Add-on Python: GPL-3.0-or-later. StanHull native/DLL: BSD-3-Clause. Icons: CC0-1.0.
# See NOTICE and native/LICENSE.
license = [
  "SPDX:GPL-3.0-or-later",
  "SPDX:BSD-3-Clause",
  "SPDX:CC0-1.0",
]

[build]
paths_exclude_pattern = [
  "__pycache__/",
  ".*",
  "tests/",
  "native/build/",
  "icons/_src/",
  "*.blend",
  "*.blend1",
  "*.zip",
]
